services:
  postgres:
    image: postgres:16-alpine
    container_name: jinro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jinro_nachimban
      POSTGRES_USER: jinro_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinro_app -d jinro_nachimban"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://jinro_app:${DB_PASSWORD:-change-me-in-production}@postgres:5432/jinro_nachimban?schema=public&sslmode=disable
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
